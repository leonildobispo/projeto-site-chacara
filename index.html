<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer">
    <link rel="stylesheet" href="src/css/styles.css">
    <title>Chacára Família Santos</title>
</head>
<body>
    <!-- Header-->
    <header>
        <nav class="navbar">
                <img 
                src="imagens-chacara/1779708468744.png" 
                alt="Placa Chácara Família Santos"
                class="logo"
                >

                <button class="btn btn-mobile">
                    <i class="fa-solid fa-bars"></i>
                </button>

                <ul id="nav-links">
                    <li>
                        <a href="#home">Home</a>
                    </li>
                    <li>
                        <a href="#about">Sobre nós</a>
                    </li>
                    <li>
                        <a href="#galeria">Galeria</a>
                    </li>
                </ul>

                <a href="https://wa.me/5511945806524" class="btn btn-default">
                Contatar
                </a>
        </nav>
    </header>

    <!--MAIN-->
    <main id="container">
        <!--Home-->
        <section id="home">
            <img 
            src="imagens-chacara/img0xx.png" 
            alt="Placa"
            class="home-image"
            width="300"
            >
            <h1 class="home-title">
                Mais que uma chacára, uma 
                <span>experiência.</span>
            </h1>

            <p class="home-description">
                Chácara aconchegante com piscina e uma bela vista para o verde, ideal para descansar e aproveitar momentos tranquilos longe da correria da cidade.
            </p>

            <div class="home-actions">
                <a href="https://wa.me/5511945806524" class="btn btn-default">
                    Contatar
                </a>
            </div>
        </section>

        <section id="galeria">
            <h1 class="galeria-title">Exterior</h1>


        <div class="slider">

            <div class="slides">
                <!--Radio btn-->
                <input type="radio" name="radio-btn" id="radio1">
                <input type="radio" name="radio-btn" id="radio2">
                <input type="radio" name="radio-btn" id="radio3">
                <input type="radio" name="radio-btn" id="radio4">
                <input type="radio" name="radio-btn" id="radio5">
                <input type="radio" name="radio-btn" id="radio6">
                <input type="radio" name="radio-btn" id="radio7">
                <input type="radio" name="radio-btn" id="radio8">
                <input type="radio" name="radio-btn" id="radio9">
                <input type="radio" name="radio-btn" id="radio10">
                <input type="radio" name="radio-btn" id="radio11">
                <input type="radio" name="radio-btn" id="radio12">

                <!--Fim radio buttons-->

                <!--Imagens do Slide-->
                <div class="slide first">
                    <img src="imagens-chacara/exterior/ext001.jpg" alt="Imagem exterior 1" />
                </div>
                <div class="slide">
                    <img src="imagens-chacara/exterior/ext002.jpg" alt="Imagem exterior 2" />
                </div>
                <div class="slide">
                    <img src="imagens-chacara/exterior/ext003.jpg" alt="Imagem exterior 3" />
                </div>
                <div class="slide">
                    <img src="imagens-chacara/exterior/ext004.jpg" alt="Imagem exterior 4" />
                </div>
                <div class="slide">
                    <img src="imagens-chacara/exterior/ext005.jpg" alt="Imagem exterior 5" />
                </div>
                <div class="slide">
                    <img src="imagens-chacara/exterior/ext006.jpg" alt="Imagem exterior 6" />
                </div>
                <div class="slide">
                    <img src="imagens-chacara/exterior/ext007.jpg" alt="Imagem exterior 7" />
                </div>
                <div class="slide">
                    <img src="imagens-chacara/exterior/ext008.jpg" alt="Imagem exterior 8" />
                </div>
                <div class="slide">
                    <img src="imagens-chacara/exterior/ext009.jpg" alt="Imagem exterior 9" />
                </div>
                <div class="slide">
                    <img src="imagens-chacara/exterior/ext010.jpg" alt="Imagem exterior 10" />
                </div>
                <div class="slide">
                    <img src="imagens-chacara/exterior/ext011.jpg" alt="Imagem exterior 11" />
                </div>
                <div class="slide">
                    <img src="imagens-chacara/exterior/ext012.jpg" alt="Imagem exterior 12" />
                </div>
                <!--Fim Imagens-->

                <!--Navigation auto-->
                <div class="navigation-auto">
                    <div class="auto-btn1"></div>
                    <div class="auto-btn2"></div>
                    <div class="auto-btn3"></div>
                    <div class="auto-btn4"></div>
                    <div class="auto-btn5"></div>
                    <div class="auto-btn6"></div>
                    <div class="auto-btn7"></div>
                    <div class="auto-btn8"></div>
                    <div class="auto-btn9"></div>
                    <div class="auto-btn10"></div>
                    <div class="auto-btn11"></div>
                    <div class="auto-btn12"></div>
                </div>
            </div>

            <div class="manual-navigation">
                <label for="radio1" class="manual-btn"></label>
                <label for="radio2" class="manual-btn"></label>
                <label for="radio3" class="manual-btn"></label>
                <label for="radio4" class="manual-btn"></label>
                <label for="radio5" class="manual-btn"></label>
                <label for="radio6" class="manual-btn"></label>
                <label for="radio7" class="manual-btn"></label>
                <label for="radio8" class="manual-btn"></label>
                <label for="radio9" class="manual-btn"></label>
                <label for="radio10" class="manual-btn"></label>
                <label for="radio11" class="manual-btn"></label>
                <label for="radio12" class="manual-btn"></label>
            </div>
        </div>
        
    </section>

    <section id="galeria2">
        <h1>Interior</h1>
    </section>
    </main>
    <script src="src/js/script.js"></script>
</body>
</html>
